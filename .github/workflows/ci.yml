name: GradEval360 CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

permissions:
  contents: write

jobs:
  build-and-test:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/gradeval360
      BETTER_AUTH_SECRET: ci_local_better_auth_secret_change_me
      BETTER_AUTH_URL: http://localhost:3000
      OKTA_ISSUER_URL: https://example.okta.com/oauth2/default
      OKTA_CLIENT_ID: ci-client-id
      OKTA_CLIENT_SECRET: ci-client-secret
      OKTA_POST_LOGIN_REDIRECT_URL: http://localhost:5173

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: gradeval360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Module
        run: cd shared && npm run build

      - name: Prepare Server DB
        run: |
          npm --prefix server run db:push
          npm --prefix server run seed

      - name: Build Server
        run: npm --prefix server run build

      - name: Build Client
        run: npm --prefix client run build

      - name: Start Server
        run: |
          npm --prefix server run start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for Server
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready in time. Dumping server.log:"
          cat server.log
          exit 1

      - name: Run Server Integration Tests
        run: npm --prefix server run test:integration

      - name: Run Auth Smoke Tests
        run: npm --prefix server run smoke:auth

      - name: Print Server Logs on Failure
        if: failure()
        run: |
          echo "CI failure detected. Server logs:"
          cat server.log || true

      - name: Run Workspace Tests
        run: npm test

      - name: Enforce Coverage Thresholds
        run: npm run test:coverage

      - name: Run Client Coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm --prefix client run test:coverage | tee client-coverage.txt

      - name: Run Server Coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm --prefix server run test:coverage | tee server-coverage.txt

      - name: Run Shared Coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm --prefix shared run test:coverage | tee shared-coverage.txt

      - name: Refresh README Metrics
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/update-readme-metrics.mjs client-coverage.txt server-coverage.txt shared-coverage.txt

      - name: Commit README Metrics
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet README.md .github/badges/coverage-summary.json; then
            echo "README metrics already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/badges/coverage-summary.json
          git commit -m "chore: update README metrics [skip ci]"
          git push
