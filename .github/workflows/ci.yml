name: GradEval360 CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/gradeval360
      BETTER_AUTH_SECRET: ci_local_better_auth_secret_change_me
      BETTER_AUTH_URL: http://localhost:3000
      OKTA_ISSUER_URL: https://example.okta.com/oauth2/default
      OKTA_CLIENT_ID: ci-client-id
      OKTA_CLIENT_SECRET: ci-client-secret
      OKTA_POST_LOGIN_REDIRECT_URL: http://localhost:5173

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: gradeval360
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Module
        run: cd shared && npm run build

      - name: Prepare Server DB
        run: |
          npm --prefix server run db:push
          npm --prefix server run seed

      - name: Build Server
        run: npm --prefix server run build

      - name: Build Client
        run: npm --prefix client run build

      - name: Start Server
        run: |
          npm --prefix server run start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for Server
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready in time. Dumping server.log:"
          cat server.log
          exit 1

      - name: Run Server Integration Tests
        run: npm --prefix server run test:integration

      - name: Run Auth Smoke Tests
        run: npm --prefix server run smoke:auth

      - name: Print Server Logs on Failure
        if: failure()
        run: |
          echo "CI failure detected. Server logs:"
          cat server.log || true

      - name: Run Workspace Tests
        run: npm test

      - name: Enforce Coverage Thresholds
        run: npm run test:coverage

      - name: Generate Workspace SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: GradEval360-sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GradEval360-sbom
          path: GradEval360-sbom.spdx.json
          if-no-files-found: error

      - name: Attest SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: GradEval360-sbom.spdx.json

      - name: Verify SBOM Attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify GradEval360-sbom.spdx.json --repo "$GITHUB_REPOSITORY"
